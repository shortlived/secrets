# mise.toml — tool versions and environment for sls (Short-Lived Secrets)
# Run `mise tasks` for a full list with descriptions.
# Run `mise run <task>` to execute a task.
# Docs: https://mise.jdx.dev/
#
# Pattern channel: python3a (orchestras/dev-patterns)
# Run `mise run patterns:sync` to pull the latest hooks and tasks.

[settings]
experimental = true

[tools]
python = "3.13"
uv = "latest"
ruff = "latest"

# delta — better git diffs in the terminal
delta = "latest"

[env]
# Ensure uv uses the project-local venv
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"
VIRTUAL_ENV = "{{config_root}}/.venv"
# Make scripts on PATH inside the venv
PATH = "{{config_root}}/.venv/bin:{{env.PATH}}"

# ─── dev-patterns channel subscription ───────────────────────────────────────
# Bump PATTERNS_VERSION to pin to a specific commit or tag.
# Run `mise run patterns:sync` to pull the latest hooks and tasks.
PATTERNS_REPO    = "orchestras/dev-patterns"
PATTERNS_CHANNEL = "python3a"
PATTERNS_VERSION = "main"

# ─── Git hooks version (legacy, used by hooks:sync) ──────────────────────────
GITHOOKS_VERSION = "main"
GITHOOKS_REPO = "orchestras/git-hooks"

# ─── Task discovery ───────────────────────────────────────────────────────────
[task_config]
includes = [".mise/tasks"]
